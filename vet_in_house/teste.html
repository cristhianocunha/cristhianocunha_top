<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Alpine.js</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        /* Estilos básicos para layout */
        
        
        /* Estilos do Modal */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn { padding: 10px 20px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 5px; }
        .btn-close { background: #ef4444; margin-top: 10px; }
    </style>
</head>
<body>

    <div x-data="{ open: false }" @keydown.escape.window="open = false">

        <button @click="open = true" class="btn">
            Abrir Modal
        </button>

        <template x-teleport="body">
            <div 
                x-show="open"
                style="display: none;" 
                class="modal-backdrop"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
            >
                <div 
                    class="modal-content"
                    @click.outside="open = false"
                >
                    <h2>Título do Modal</h2>
                    <p>Este é um modal criado com Alpine.js. É leve e reativo.</p>
                    
                    <button @click="open = false" class="btn btn-close">
                        Fechar
                    </button>
                </div>
            </div>
        </template>

    </div>

</body>
</html>
